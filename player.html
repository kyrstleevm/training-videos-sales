<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Restricted Video Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    .error-msg {
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding-top: 20%;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <script>
    // 1. Automatically extract the 'v' parameter from the URL bar
    const urlParams = new URLSearchParams(window.location.search);
    const YOUTUBE_VIDEO_ID = urlParams.get('v');

    if (!YOUTUBE_VIDEO_ID) {
      document.body.innerHTML = '<div class="error-msg">Error: No YouTube Video ID provided in the URL parameter. Example: player.html?v=VIDEO_ID</div>';
    } else {
      // 2. Load the YouTube IFrame Player API
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    var player;
    var maxTimeWatched = 0;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
          'rel': 0,
          'modestbranding': 1,
          'controls': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      setInterval(checkProgress, 250);
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        checkProgress();
      }
    }

    function checkProgress() {
      if (!player || typeof player.getCurrentTime !== 'function') return;
      
      var currentTime = player.getCurrentTime();

      // Enforce anti-forwarding logic
      if (currentTime > maxTimeWatched + 1.5) { 
        player.seekTo(maxTimeWatched, true);
      } else if (currentTime > maxTimeWatched) {
        maxTimeWatched = currentTime;
      }
    }
  </script>
</body>
</html>
