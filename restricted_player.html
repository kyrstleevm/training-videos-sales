<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Restricted Video Player</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <video id="restrictedVideo" controls controlsList="nodownload">
    <!-- Replace URL with your direct raw video link (e.g., stored on GitHub, Cloudinary free tier, etc.) -->
    <source src="YOUR_DIRECT_VIDEO_URL_HERE.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    const video = document.getElementById('restrictedVideo');
    let maxTimeWatched = 0;

    // Continuously update the furthest point reached
    video.addEventListener('timeupdate', () => {
      if (!video.seeking) {
        if (video.currentTime > maxTimeWatched) {
          maxTimeWatched = video.currentTime;
        }
      }
    });

    // Enforce anti-forwarding restriction on seek
    video.addEventListener('seeking', () => {
      if (video.currentTime > maxTimeWatched) {
        // Prevent forwarding past furthest watched point
        video.currentTime = maxTimeWatched;
      }
    });
  </script>

</body>
</html>
