<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Restricted Video Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <script>
    const YOUTUBE_VIDEO_ID = 'b74pQsp-AVM';

    // Load the YouTube IFrame Player API asynchronously
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var maxTimeWatched = 0;
    var checkInterval;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
          'rel': 0,
          'modestbranding': 1,
          'controls': 1 // Keeps play/pause and progress bar active
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      // Monitor current time position every 250 milliseconds
      checkInterval = setInterval(checkProgress, 250);
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        checkProgress();
      }
    }

    function checkProgress() {
      if (!player || typeof player.getCurrentTime !== 'function') return;
      
      var currentTime = player.getCurrentTime();

      // If user tries to scrub forward past their maximum watched time, snap back
      if (currentTime > maxTimeWatched + 1.5) { 
        player.seekTo(maxTimeWatched, true);
      } else if (currentTime > maxTimeWatched) {
        maxTimeWatched = currentTime;
      }
    }
  </script>
</body>
</html>
