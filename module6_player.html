<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restricted Video Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <video id="restrictedVideo" controls controlsList="nodownload">
    <source src="https://lh3.googleusercontent.com/d/1k5XbDj62DAqAIBdaguvDzetDzgjc3DD9" type="video/mp4">
  Your browser does not support the video tag.
  </video>

  <script>
    const video = document.getElementById('restrictedVideo');
    let maxTimeWatched = 0;

    // Track the furthest point the user has actually watched
    video.addEventListener('timeupdate', () => {
      if (!video.seeking) {
        if (video.currentTime > maxTimeWatched) {
          maxTimeWatched = video.currentTime;
        }
      }
    });

    // Enforce restriction: reset position if attempting to skip ahead
    video.addEventListener('seeking', () => {
      if (video.currentTime > maxTimeWatched) {
        video.currentTime = maxTimeWatched;
      }
    });
  </script>

</body>
</html>
